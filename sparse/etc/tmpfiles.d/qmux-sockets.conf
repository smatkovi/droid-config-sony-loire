# qmuxd and netmgrd create their sockets inside these directories but do
# not create the directories themselves.  On stock Android they come from
# device/sony/common/rootdir/vendor/etc/init/hw/init.common.rc (lines 270ff);
# in a hybris port nothing creates them, so qmuxd fails with
#   qmi_client: unable to bind to client socket, errno[2:No such file or directory]
#
# Ownership differs per directory - keep it identical to init.common.rc.
d /dev/socket/qmux_radio     2770 radio     radio     -
d /dev/socket/qmux_audio     2770 media     audio     -
d /dev/socket/qmux_bluetooth 2770 bluetooth bluetooth -
d /dev/socket/qmux_gps       2770 gps       gps       -
d /dev/socket/qmux_nfc       2770 radio     nfc       -
d /dev/socket/netmgr         0750 radio     radio     -
