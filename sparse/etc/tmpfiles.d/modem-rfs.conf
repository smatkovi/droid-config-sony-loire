# The modem accesses its files through the RFS symlink tree under
# /vendor/rfs.  On stock Android this comes from the vendor image; a
# hybris port has to recreate it, otherwise the modem cannot read its
# configuration and never registers the QMI UIM service (0x0b) -
# rild then loops on "Card status is unknown for slot: 0x0".
d /data/vendor/tombstones/rfs/modem 0770 radio radio -
d /data/vendor/tombstones/rfs/lpass 0770 radio radio -
d /vendor/rfs/msm/mpss/readonly/vendor 0755 root root -
d /vendor/rfs/msm/adsp/readonly/vendor 0755 root root -
d /vendor/rfs/msm/slpi/readonly/vendor 0755 root root -
L /vendor/rfs/msm/mpss/hlos                     - - - - /persist/hlos_rfs/shared
L /vendor/rfs/msm/mpss/ramdumps                 - - - - /data/vendor/tombstones/rfs/modem
L /vendor/rfs/msm/mpss/readwrite                - - - - /persist/rfs/msm/mpss
L /vendor/rfs/msm/mpss/shared                   - - - - /persist/rfs/shared
L /vendor/rfs/msm/mpss/readonly/firmware        - - - - /firmware
L /vendor/rfs/msm/mpss/readonly/vendor/firmware - - - - /vendor/firmware
L /vendor/rfs/msm/adsp/hlos                     - - - - /persist/hlos_rfs/shared
L /vendor/rfs/msm/adsp/ramdumps                 - - - - /data/vendor/tombstones/rfs/lpass
L /vendor/rfs/msm/adsp/readwrite                - - - - /persist/rfs/msm/adsp
L /vendor/rfs/msm/adsp/shared                   - - - - /persist/rfs/shared
L /vendor/rfs/msm/adsp/readonly/firmware        - - - - /firmware
L /vendor/rfs/msm/adsp/readonly/vendor/firmware - - - - /vendor/firmware
